# R1 helper: symbolicate exe RVAs against the PDB from a previous build's
# artifact (llvm-symbolizer is preinstalled on windows-latest and reads
# PDBs natively). Used to turn wine +seh crash addresses into
# file:line without a local Windows toolchain.

name: R1-Symbolicate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id whose artifact holds the exe+pdb"
        required: true
      artifact:
        description: "Artifact name"
        default: "r0_DX11_dedicated_bin"
      addresses:
        description: "Space-separated RVAs (hex, e.g. 0x1E8439)"
        required: true

jobs:
  symbolicate:
    runs-on: windows-latest
    steps:
    - name: Download artifact
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download ${{ inputs.run_id }} --repo ${{ github.repository }} --name "${{ inputs.artifact }}" -D art
        Get-ChildItem art

    - name: Install fresh LLVM
      shell: pwsh
      run: |
        # The preinstalled llvm-symbolizer crashes parsing our PDB; install current LLVM.
        choco install llvm -y --no-progress | Out-Null
        $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
        & "C:\Program Files\LLVM\bin\llvm-symbolizer.exe" --version

    - name: Symbolicate
      shell: pwsh
      run: |
        $exe = (Get-ChildItem art -Recurse -Filter *.exe | Select-Object -First 1).FullName
        "exe: $exe"
        $sym = "C:\Program Files\LLVM\bin\llvm-symbolizer.exe"
        foreach ($a in "${{ inputs.addresses }}".Split(" ")) {
          "=== $a ==="
          & $sym --obj="$exe" --relative-address --functions=linkage --demangle $a
        }
