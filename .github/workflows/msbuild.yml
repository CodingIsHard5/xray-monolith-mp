# Spike 1 (STALKER MP mod): prove the engine builds from public source.
# Trimmed from upstream's workflow — DX11 + DX8 only, no MT/pack/release jobs,
# artifacts kept 7 days so they can be pulled down and run under wine.

name: Spike1-Build

on:
  push:
    branches: [ "spike1-ci" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln

jobs:
  build:
    name: build-${{ matrix.buildconf }}
    runs-on: windows-latest

    strategy:
      matrix:
        buildconf: ["DX11", "DX8"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{ matrix.buildconf }}
      run: msbuild /m /p:Configuration=${{ matrix.buildconf }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Upload binaries
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ matrix.buildconf }}_bin
        path: |
          ./_build/_game/bin_dbg/*.exe
          ./_build/_game/bin_dbg/*.pdb
        if-no-files-found: "error"
        retention-days: 7
